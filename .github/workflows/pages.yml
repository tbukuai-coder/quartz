name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      - name: Pull wiki content
        run: |
          rm -rf content
          # Retry up to 3 times on rate limit
          for i in 1 2 3; do
            if git clone --depth 1 https://huggingface.co/datasets/tbukuai/hf-papers-wiki content 2>/dev/null; then
              break
            fi
            echo "Attempt $i failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          rm -f content/README.md

      - name: Build Quartz
        run: npx quartz build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
